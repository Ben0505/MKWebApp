<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stats — CV. Miki Kijang</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
:root{
  --bg:#F5F2ED;--surface:#FFF;--surface2:#F0EDE8;
  --border:#D9D4CC;--border-dark:#2D2926;
  --text:#1A1714;--text-2:#6B6560;--text-3:#9E9891;
  --accent:#C4501A;--accent-bg:#FDF1EC;
  --green:#1A6B45;--green-bg:#EDF6F1;
  --amber:#8B5C00;--amber-bg:#FEF8EC;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --radius:10px;--radius-sm:6px;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
  --nav-h:56px;--header-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;}

/* ── Desktop sidebar layout ── */
@media(min-width:640px){
  .desktop{display:grid;grid-template-columns:210px 1fr;min-height:100vh;}
  .mobile-only{display:none!important;}
}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
.topbar-title{font-size:14px;font-weight:600;}
.d-content{padding:22px 26px 60px;}

/* ── Mobile layout ── */

.m-header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--text);display:flex;align-items:center;padding:0 16px;z-index:50;}
.m-header-title{font-size:15px;font-weight:600;color:#fff;}
.m-main{padding-top:calc(var(--header-h) + 0px);padding-bottom:calc(var(--nav-h) + 12px);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--text-3);padding:6px 0;}
.bn-item.active{color:var(--accent);}
.bn-icon{font-size:18px;line-height:1;}
.bn-lbl{font-size:10px;font-family:var(--mono);}

/* ── Shared styles ── */
input,select{font-family:var(--sans);font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;}
input:focus,select:focus{border-color:var(--border-dark);box-shadow:0 0 0 3px rgba(29,23,20,.06);}
input::placeholder{color:var(--text-3);}
.sel{position:relative;}
.sel::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;font-size:11px;}
.sel select{padding-right:28px;cursor:pointer;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;}
.card:last-child{margin-bottom:0;}
.card-hd{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-hd h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);}
.card-hd .meta{font-size:11px;color:var(--text-3);font-family:var(--mono);}
.card-body{padding:16px 18px;}

/* Filter section */
.filter-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.flbl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-family:var(--mono);white-space:nowrap;}
.fdiv{width:1px;height:22px;background:var(--border);}
.qrow{display:flex;gap:5px;flex-wrap:wrap;}
.qbtn{font-size:12px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:var(--surface);color:var(--text-2);font-family:var(--mono);transition:all .12s;white-space:nowrap;}
.qbtn:hover,.qbtn.on{background:var(--text);color:#fff;border-color:var(--text);}

/* Mobile filter */
.m-filter{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 14px;}
.m-qrow{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;margin-bottom:10px;}
.m-qrow::-webkit-scrollbar{display:none;}
.m-qbtn{font-size:12px;padding:6px 14px;border:1px solid var(--border);border-radius:999px;cursor:pointer;background:var(--surface);color:var(--text-2);font-family:var(--mono);white-space:nowrap;flex-shrink:0;}
.m-qbtn.on{background:var(--text);color:#fff;border-color:var(--text);}
.m-date-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.m-date-row input{font-size:13px;padding:8px 10px;}

/* ── Summary cards ── */
.sum-grid{display:grid;gap:12px;margin-bottom:16px;}
.sum-grid-4{grid-template-columns:repeat(4,1fr);}
.sum-grid-2{grid-template-columns:1fr 1fr;}
@media(max-width:639px){.sum-grid-4{grid-template-columns:1fr 1fr;}}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.sc-lbl{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-family:var(--mono);margin-bottom:6px;}
.sc-val{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1.1;}
.sc-sub{font-size:11px;color:var(--text-3);margin-top:3px;font-family:var(--mono);}
.sc-accent .sc-val{color:var(--accent);}
.sc-green .sc-val{color:var(--green);}
.sc-blue .sc-val{color:var(--blue);}

/* ── Category breakdown ── */
.cat-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.cat-row:last-child{border-bottom:none;}
.cat-color{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.cat-name{font-size:13px;font-weight:500;flex:1;}
.cat-stats{display:flex;gap:20px;align-items:center;}
.cat-stat{text-align:right;}
.cat-stat .cv{font-family:var(--mono);font-size:13px;font-weight:600;}
.cat-stat .cl{font-size:10px;color:var(--text-3);font-family:var(--mono);}

/* Bar chart */
.bar-wrap{margin-top:4px;display:flex;align-items:center;gap:8px;}
.bar-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .4s ease;}

/* ── Produk breakdown table ── */
.prod-table{width:100%;border-collapse:collapse;}
.prod-table th{text-align:left;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-family:var(--mono);padding:0 12px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
.prod-table th:not(:first-child){text-align:right;}
.prod-table td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--surface2);vertical-align:middle;}
.prod-table td:not(:first-child){text-align:right;font-family:var(--mono);}
.prod-table tr:last-child td{border-bottom:none;}
.prod-name{font-weight:500;}
.prod-cat{font-size:11px;color:var(--text-3);}

/* ── Top pelanggan ── */
.top-plg-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.top-plg-row:last-child{border-bottom:none;}
.rank{font-family:var(--mono);font-size:12px;color:var(--text-3);min-width:20px;}
.plg-name{font-size:13px;font-weight:500;flex:1;}
.plg-total{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);}
.plg-nota{font-size:11px;color:var(--text-3);font-family:var(--mono);}

.cat-colors{--c0:#C4501A;--c1:#1A6B45;--c2:#185FA5;--c3:#8B5C00;--c4:#534AB7;--c5:#1D9E75;}
.empty-state{padding:32px;text-align:center;color:var(--text-3);font-size:13px;font-style:italic;}

/* Per-barang: always expanded, kategori as section header */
.kat-group{border-bottom:3px solid var(--border-dark);margin-bottom:0;}
.kat-group:last-child{border-bottom:none;}
.kat-header{display:flex;align-items:center;gap:10px;padding:12px 18px 10px;background:var(--text);}
.kat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.kat-label{font-size:12px;font-weight:600;flex:1;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);color:rgba(255,255,255,.85);}
.kat-summary{display:flex;gap:0;align-items:center;}
.ks-item{text-align:right;padding:0 20px;border-left:1px solid rgba(255,255,255,.12);}
.ks-item:first-child{border-left:none;}
.ks-v{font-family:var(--mono);font-size:12px;font-weight:600;color:rgba(255,255,255,.9);}
.ks-l{font-size:10px;color:rgba(255,255,255,.4);font-family:var(--mono);}
/* product rows inside kategori */
.prod-row{display:grid;grid-template-columns:1fr 80px 90px 110px;gap:8px;padding:9px 18px 9px 52px;border-top:1px solid var(--surface2);align-items:center;}
.prod-row:hover{background:var(--surface2);}
.pr-name{font-size:12px;font-weight:500;}
.pr-num{font-family:var(--mono);font-size:12px;font-weight:500;text-align:right;color:var(--text-2);}
.pr-num.accent{font-weight:600;}
/* column header inside card */
.prod-col-hd{display:grid;grid-template-columns:1fr 80px 90px 110px;gap:8px;padding:6px 18px 6px 52px;background:var(--surface2);border-top:1px solid var(--border);}
.prod-col-hd span{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-family:var(--mono);text-align:right;}
.prod-col-hd span:first-child{text-align:left;}

/* nav.css overrides — hide old bottom-nav and mobile header */
.bottom-nav{display:none!important;}
.m-header{display:none!important;}
.mobile-header{display:none!important;}

/* Stats responsive fixes */
@media(max-width:767px){
  .filter-card{padding:10px 12px;}
  .filter-row{flex-wrap:wrap;gap:8px;}
  .filter-row input[type=date]{max-width:100%;flex:1;}
  .fdiv{display:none;}
  .sum-grid-4{grid-template-columns:1fr 1fr!important;}
  div[style*="grid-template-columns:1fr 1fr;"]{grid-template-columns:1fr!important;}
}
@media(min-width:640px) and (max-width:1023px){
  .sum-grid-4{grid-template-columns:1fr 1fr!important;}
  .filter-row{flex-wrap:wrap;}
}
.chart-grid{grid-template-columns:1fr 1fr;}
@media(max-width:767px){.chart-grid{grid-template-columns:1fr!important;}}
</style>

<script src="mk-config.js"></script>
<script src="auth.js"></script>
<script src="mk-net.js"></script>
<style id="mk-layout-fix">
/* Layout override — sidebar now handled by auth.js */
.app{display:flex!important;min-height:100vh;}
.sidebar{position:fixed!important;}
@media(min-width:1024px){.main{margin-left:210px!important;}}
@media(min-width:640px) and (max-width:1023px){.main{margin-left:60px!important;}}
@media(max-width:639px){.main{margin-left:0!important;}}
/* Remove old grid/mobile patterns */
.desktop{display:block!important;min-height:unset!important;}
.mobile-only{display:none!important;}
</style>
<!-- responsive-stats.html -->
<style>
/* ── Stats responsive ── */
@media(min-width:640px) and (max-width:1023px){
  .d-content,.content{padding:16px 18px 50px!important;}
  .chart-grid{grid-template-columns:1fr!important;}
  .sum-grid-4{grid-template-columns:1fr 1fr!important;}
  .filter-row{flex-wrap:wrap;gap:8px;}
}
@media(max-width:639px){
  .d-content,.content{padding:calc(var(--header-h,52px)+12px) 10px 40px!important;}
  .chart-grid{grid-template-columns:1fr!important;}
  .sum-grid-4,.sum-grid-2{grid-template-columns:1fr 1fr!important;}
  .filter-row{flex-direction:column;align-items:stretch;}
  .fdiv{display:none;}
  .qrow{flex-wrap:wrap;}
}
</style>
<link rel="stylesheet" href="mk-responsive.css">
</head>
<body>

<!-- ════════════════════════════════════
     DESKTOP LAYOUT
════════════════════════════════════ -->
<div class="app">
<aside class="sidebar" id="d-sidebar"></aside>
<div class="main">
    <div class="topbar"><div class="topbar-title">📊 Stats Penjualan</div>
      <div class="topbar-user" id="d-topbar-user" style="font-size:12px;color:var(--text-3);font-family:\'DM Mono\',monospace;"></div><div id="m-av" style="display:none;"></div></div>
    <div class="content d-content">
      <!-- Filter desktop -->
      <div class="filter-card">
        <div class="filter-row">
          <div class="qrow" id="d-qbtns">
            <button class="qbtn on" onclick="setQ(this,'today','d')">Hari ini</button>
            <button class="qbtn" onclick="setQ(this,'week','d')">7 hari</button>
            <button class="qbtn" onclick="setQ(this,'month','d')">Bulan ini</button>
          </div>
          <div class="fdiv"></div>
          <!-- Month + Year picker -->
          <div style="display:flex;align-items:center;gap:6px;">
            <div style="position:relative;">
              <select id="d-sel-bulan" onchange="setMonth('d')" style="font-size:13px;padding:6px 28px 6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);cursor:pointer;">
                <option value="">— Bulan</option>
                <option value="1">Januari</option><option value="2">Februari</option>
                <option value="3">Maret</option><option value="4">April</option>
                <option value="5">Mei</option><option value="6">Juni</option>
                <option value="7">Juli</option><option value="8">Agustus</option>
                <option value="9">September</option><option value="10">Oktober</option>
                <option value="11">November</option><option value="12">Desember</option>
              </select>
              <span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-3);pointer-events:none;">▾</span>
            </div>
            <div style="position:relative;">
              <select id="d-sel-tahun" onchange="setMonth('d')" style="font-size:13px;padding:6px 28px 6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);cursor:pointer;">
              </select>
              <span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-3);pointer-events:none;">▾</span>
            </div>
          </div>
          <div class="fdiv"></div>
          <span class="flbl">Dari</span>
          <input type="date" id="d-dari" onchange="clearMonthSel('d');compute('d')" style="max-width:150px;">
          <span class="flbl">Sampai</span>
          <input type="date" id="d-sampai" onchange="clearMonthSel('d');compute('d')" style="max-width:150px;">
        </div>
      </div>
      <!-- Summary cards desktop -->
      <div class="sum-grid sum-grid-4" id="d-sum-grid">
        <div class="sc sc-accent"><div class="sc-lbl">Total Omset</div><div class="sc-val" id="d-omset">—</div><div class="sc-sub" id="d-omset-sub">—</div></div>
        <div class="sc"><div class="sc-lbl">Total Nota</div><div class="sc-val" id="d-nota">—</div><div class="sc-sub">nota penjualan</div></div>
        <div class="sc sc-blue"><div class="sc-lbl">Total Unit</div><div class="sc-val" id="d-unit">—</div><div class="sc-sub">semua satuan</div></div>
        <div class="sc sc-green"><div class="sc-lbl">Total Berat</div><div class="sc-val" id="d-kg">—</div><div class="sc-sub">kilogram</div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;" class="chart-grid">
        <!-- Per Barang: kategori dropdown + produk di dalamnya -->
        <div class="card">
          <div class="card-hd"><h2>Per Barang</h2><span class="meta" id="d-kat-meta">—</span></div>
          <div class="card-body" style="padding:0;" id="d-kat-body"><div class="empty-state" style="padding:24px;">Tidak ada data</div></div>
        </div>
        <!-- Top pelanggan -->
        <div class="card">
          <div class="card-hd"><h2>Top Pelanggan</h2><span class="meta">by omset</span></div>
          <div class="card-body" id="d-plg-body"><div class="empty-state">Tidak ada data</div></div>
        </div>
      </div>

      <!-- Pengambilan per pelanggan -->
      <div class="card">
        <div class="card-hd"><h2>Pengambilan Per Pelanggan</h2><span class="meta" id="d-plg-bk-meta">detail per nota</span></div>
        <div class="card-body" id="d-plg-breakdown"><div class="empty-state">Tidak ada data</div></div>
      </div>

    </div>
  </div>
</div>

<script>
const GAS_URL = MK_CONFIG.GAS;

let ALL_NOTAS=[], PRODUK=[], ALL_LANGSIRAN=[], ALL_STOCK=[];
// Category-specific colors — fixed per category name
const CAT_COLOR_MAP = {
  'Makaroni': '#1A6B45',   // hijau (swap dari Lago)
  'Lago':     '#C4501A',   // oranye (swap dari Makaroni)
  'Cipir':    '#E24B4A',   // merah
  'Kerupuk':  '#8B5C00',   // amber
  'Lainnya':  '#888780',   // abu
};
function getCatColor(kat){ return CAT_COLOR_MAP[kat] || '#534AB7'; }


function jakartaDate(offsetDays=0){
  const d = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Jakarta'}));
  d.setDate(d.getDate() + offsetDays);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
window.addEventListener('DOMContentLoaded', async () => {
  // Auth
  MK_AUTH.ensureDemo();
  const SESS = MK_AUTH.require('login.html', ['packaging','admin']);
  if(!SESS) return;
  MK_AUTH.initSidebar('stats.html');
    const now = new Date();
  const todayStr = jakartaDate();
  const dateStr = now.toLocaleDateString('id-ID',{weekday:'long'})+'<br>'+now.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  MK_LOADER.show();
  try {
    const [dN,dP,dL,dS] = await Promise.all([
      MK_CACHE.fetch('getAllNotas',   GAS_URL),
      MK_CACHE.fetch('getProduk',     GAS_URL),
      MK_CACHE.fetch('getLangsiran',  GAS_URL),
      MK_CACHE.fetch('getStock',      GAS_URL),
    ]);
    ALL_NOTAS    = dN.success ? dN.notas    : [];
    PRODUK       = dP.success ? dP.produk   : [];
    ALL_LANGSIRAN= dL.success ? dL.langsiran: [];
    ALL_STOCK    = dS.success ? dS.stock    : [];
  } catch(e){ ALL_NOTAS=[]; PRODUK=[]; ALL_LANGSIRAN=[]; ALL_STOCK=[]; } finally{ MK_LOADER.hide(); }

  populateYears();
  setQ(document.querySelector('#d-qbtns .m-qbtn, #d-qbtns .qbtn'), 'today', 'd', true);
  // mobile uses same 'd' layout
});

function go(p){ window.location.href=p; }



/* ══════════════════════════════════════
   SPREADSHEET SUMMARY TABLE
══════════════════════════════════════ */


/* ── Populate year dropdowns from data ── */
function populateYears() {
  const years = [...new Set(ALL_NOTAS.map(n => n.tanggal ? n.tanggal.slice(0,4) : null).filter(Boolean))];
  const now = new Date().getFullYear();
  if(!years.includes(String(now))) years.push(String(now));
  years.sort((a,b)=>b-a);

  ['d-sel-tahun','m-sel-tahun'].forEach(id => {
    const sel = document.getElementById(id);
    if(!sel) return;
    sel.innerHTML = years.map(y=>`<option value="${y}">${y}</option>`).join('');
    // Default to current year
    sel.value = String(now);
  });
}

/* ── Set filter to a specific month/year ── */
function setMonth(layout) {
  const bulan = +document.getElementById(layout+'-sel-bulan').value;
  const tahun = +document.getElementById(layout+'-sel-tahun').value;
  if(!bulan || !tahun) return;

  // Clear quick buttons
  const container = document.getElementById(layout==='d'?'d-qbtns':'m-qbtns');
  container.querySelectorAll('.qbtn,.m-qbtn').forEach(b=>b.classList.remove('on'));

  const dari   = `${tahun}-${String(bulan).padStart(2,'0')}-01`;
  const lastDay = new Date(tahun, bulan, 0);
  const sampai = `${lastDay.getFullYear()}-${String(lastDay.getMonth()+1).padStart(2,'0')}-${String(lastDay.getDate()).padStart(2,'0')}`;
  document.getElementById(layout+'-dari').value   = dari;
  document.getElementById(layout+'-sampai').value = sampai;
  compute(layout);
}

function clearMonthSel(layout) {
  const b = document.getElementById(layout+'-sel-bulan');
  const t = document.getElementById(layout+'-sel-tahun');
  if(b) b.value = '';
}

function setQ(btn, preset, layout, silent=false) {
  const container = document.getElementById(layout==='d' ? 'd-qbtns' : 'm-qbtns');
  if(!silent && btn) {
    container.querySelectorAll('.qbtn,.m-qbtn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  }
  const now=new Date();
  const sampai=jakartaDate(); let dari='';
  if(preset==='today'){ dari=sampai; }
  else if(preset==='week'){ dari=jakartaDate(-6); }
  else if(preset==='month'){ const jkt=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Jakarta'}));dari=`${jkt.getFullYear()}-${String(jkt.getMonth()+1).padStart(2,'0')}-01`; }
  else { dari=''; sampai=''; }
  document.getElementById(layout+'-dari').value = dari;
  document.getElementById(layout+'-sampai').value = sampai;
  compute(layout);
}

/* ── Main computation ── */
function compute(layout) {
  const dari   = document.getElementById(layout+'-dari').value;
  const sampai = document.getElementById(layout+'-sampai').value;

  // Filter notas by date
  const notas = ALL_NOTAS.filter(n => {
    if(dari   && n.tanggal < dari)   return false;
    if(sampai && n.tanggal > sampai) return false;
    return true;
  });

  // Totals
  const totalOmset = notas.reduce((s,n)=>s+(n.total||0),0);
  const totalNota  = notas.length;

  // Build product lookup: name → {kategori, berat per satuan}
  const prodLookup = {};
  PRODUK.forEach(p => {
    prodLookup[p.nama] = { kategori: p.kategori||'Lainnya', satuanList: p.satuanList||[] };
  });

  // Parse items and aggregate
  const katData = {};   // kategori → {omset, unit, kg}
  const prodData = {};  // produk → {kategori, omset, unit, kg}
  const plgData  = {};  // pelanggan → {omset, nota}

  notas.forEach(n => {
    // Pelanggan
    if(!plgData[n.client]) plgData[n.client]={omset:0,nota:0};
    plgData[n.client].omset += n.total||0;
    plgData[n.client].nota++;

    // Items
    const items = parseItems(n.items, n.itemsParsed, n.itemsArray);
    items.forEach(it => {
      const info   = prodLookup[it.nama] || { kategori:'Lainnya', satuanList:[] };
      const kat    = info.kategori;
      const satInfo= info.satuanList.find(s=>s.satuan===it.satuan)||{};
      const berat  = satInfo.berat ? satInfo.berat * (it.qty||0) : 0;
      const omset  = (it.harga||0) * (it.qty||0);

      if(!katData[kat]) katData[kat]={omset:0,unit:0,kg:0};
      katData[kat].omset += omset;
      katData[kat].unit  += it.qty||0;
      katData[kat].kg    += berat;

      if(!prodData[it.nama]) prodData[it.nama]={kategori:kat,omset:0,unit:0,kg:0};
      prodData[it.nama].omset += omset;
      prodData[it.nama].unit  += it.qty||0;
      prodData[it.nama].kg    += berat;
    });
  });

  const totalUnit = Object.values(katData).reduce((s,k)=>s+k.unit,0);
  const totalKg   = Object.values(katData).reduce((s,k)=>s+k.kg,0);

  // Date label
  const dari2   = document.getElementById(layout+'-dari').value;
  const sampai2 = document.getElementById(layout+'-sampai').value;
  const periodLbl = dari2&&sampai2&&dari2===sampai2 ? fd(dari2) : dari2&&sampai2 ? `${fd(dari2)} — ${fd(sampai2)}` : dari2 ? `sejak ${fd(dari2)}` : 'Semua waktu';

  // Render
  renderSummary(layout, totalOmset, totalNota, totalUnit, totalKg, periodLbl);
  renderPerBarang(layout, katData, prodData);
  renderTopPelanggan(layout, plgData);
  renderPlgBreakdown(layout, notas);
}

function renderSummary(layout, omset, nota, unit, kg, period) {
  document.getElementById(layout+'-omset').textContent = rpS(omset);
  document.getElementById(layout+'-omset-sub').textContent = period;
  document.getElementById(layout+'-nota').textContent = nota.toLocaleString('id-ID');
  document.getElementById(layout+'-unit').textContent = unit.toLocaleString('id-ID');
  document.getElementById(layout+'-kg').textContent   = kg>0 ? kg.toFixed(1)+' kg' : '—';
}

/* ── Per Barang: kategori as accordion, produk inside ── */
function renderPerBarang(layout, katData, prodData) {
  const elBody = document.getElementById(layout+'-kat-body');
  const elMeta = document.getElementById(layout+'-kat-meta');

  const cats = Object.entries(katData).sort((a,b)=>b[1].omset-a[1].omset);
  elMeta.textContent = `${cats.length} kategori · ${Object.keys(prodData).length} produk`;

  if(!cats.length){ elBody.innerHTML='<div class="empty-state" style="padding:24px;">Tidak ada data</div>'; return; }

  // Column header row (shown once per kategori)
  const colHd = `<div class="prod-col-hd">
    <span>Produk</span>
    <span>Unit</span>
    <span>Berat</span>
    <span>Omset</span>
  </div>`;

  const html = cats.map(([kat,d])=>{
    const color = getCatColor(kat);
    const prodsInKat = Object.entries(prodData)
      .filter(([,pd])=>pd.kategori===kat)
      .sort((a,b)=>b[1].unit-a[1].unit);

    const prodRows = prodsInKat.map(([nama,pd])=>`
      <div class="prod-row">
        <div class="pr-name" style="color:${color}">${nama}</div>
        <div class="pr-num">${pd.unit.toLocaleString('id-ID')}</div>
        <div class="pr-num">${pd.kg>0?pd.kg.toFixed(1)+' kg':'—'}</div>
        <div class="pr-num accent" style="color:${color}">${rpS(pd.omset)}</div>
      </div>`).join('');

    return `<div class="kat-group">
      <div class="kat-header">
        <div class="kat-dot" style="background:${color}"></div>
        <div class="kat-label">${kat}</div>
        <div class="kat-summary">
          <div class="ks-item"><div class="ks-v">${d.unit.toLocaleString('id-ID')}</div><div class="ks-l">unit</div></div>
          <div class="ks-item"><div class="ks-v">${d.kg>0?d.kg.toFixed(1)+' kg':'—'}</div><div class="ks-l">berat</div></div>
          <div class="ks-item"><div class="ks-v">${rpS(d.omset)}</div><div class="ks-l">omset</div></div>
        </div>
      </div>
      ${colHd}
      ${prodRows}
    </div>`;
  }).join('');

  elBody.innerHTML = html;
}

function renderPlgBreakdown(layout, notas) {
  const el = document.getElementById(layout+'-plg-breakdown');
  if(!el) return;
  if(!notas.length){ el.innerHTML='<div class="empty-state">Tidak ada data</div>'; return; }

  // Build produk lookup for kategori + berat
  const prodLookup2 = {};
  PRODUK.forEach(p => {
    prodLookup2[p.nama] = { kategori: p.kategori||'Lainnya', satuanList: p.satuanList||[] };
  });

  // Group by pelanggan
  const byPlg = {};
  notas.forEach(n => {
    if(!byPlg[n.client]) byPlg[n.client] = { notas:[], total:0, items:{} };
    byPlg[n.client].notas.push(n);
    byPlg[n.client].total += n.total||0;
    const items = parseItems(n.items, n.itemsParsed, n.itemsArray);
    items.forEach(it => {
      if(!it.nama) return;
      const key     = `${it.nama}|${it.satuan||''}`;
      const info    = prodLookup2[it.nama] || { kategori:'Lainnya', satuanList:[] };
      const satInfo = info.satuanList.find(s=>s.satuan===it.satuan) || {};
      const berat   = satInfo.berat ? satInfo.berat * (it.qty||0) : 0;
      if(!byPlg[n.client].items[key])
        byPlg[n.client].items[key] = { nama:it.nama, satuan:it.satuan||'', kategori:info.kategori, qty:0, kg:0, total:0 };
      byPlg[n.client].items[key].qty   += it.qty||0;
      byPlg[n.client].items[key].kg    += berat;
      byPlg[n.client].items[key].total += (it.qty||0)*(it.harga||0);
    });
  });

  const sorted   = Object.entries(byPlg).sort((a,b)=>b[1].total-a[1].total);
  const maxTotal = sorted[0][1].total;

  const colHd = `<div style="display:grid;grid-template-columns:1fr 60px 70px 80px;gap:4px;padding:5px 10px 5px;background:var(--surface2);border-bottom:1px solid var(--border);">
    <span style="font-size:10px;color:var(--text-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;">Produk</span>
    <span style="font-size:10px;color:var(--text-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;text-align:right;">Qty</span>
    <span style="font-size:10px;color:var(--text-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;text-align:right;">Berat</span>
    <span style="font-size:10px;color:var(--text-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;text-align:right;padding-right:0;">Nilai</span>
  </div>`;

  el.innerHTML = sorted.map(([nama, d]) => {
    const pct = maxTotal>0 ? Math.round(d.total/maxTotal*100) : 0;

    // Group items by kategori
    const byKat = {};
    Object.values(d.items).forEach(it => {
      const k = it.kategori || 'Lainnya';
      if(!byKat[k]) byKat[k] = [];
      byKat[k].push(it);
    });
    // Sort each kategori by qty desc
    Object.values(byKat).forEach(arr => arr.sort((a,b)=>b.qty-a.qty));

    const katKeys = Object.keys(byKat).sort();

    const itemsHTML = katKeys.map(kat => {
      const katItems = byKat[kat];
      const katTotal = katItems.reduce((s,it)=>s+it.total,0);
      const katQty   = katItems.reduce((s,it)=>s+it.qty,0);
      const katKg    = katItems.reduce((s,it)=>s+it.kg,0);
      const rows = katItems.map(it =>
        `<div style="display:grid;grid-template-columns:1fr 60px 70px 80px;gap:4px;padding:5px 10px;border-bottom:1px solid var(--surface2);font-size:11px;align-items:center;">
          <span style="color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;">
            <span style="color:var(--text-3);font-size:10px;">↳ </span>${it.nama}
            <span style="color:var(--text-3);font-size:10px;font-family:var(--mono);"> ${it.satuan}</span>
          </span>
          <span style="font-family:var(--mono);color:var(--text-2);text-align:right;">${it.qty.toLocaleString('id-ID')}</span>
          <span style="font-family:var(--mono);color:var(--text-3);text-align:right;">${it.kg>0?it.kg.toFixed(1)+' kg':'—'}</span>
          <span style="font-family:var(--mono);color:var(--text-3);text-align:right;">${it.total>0?rpS(it.total):'—'}</span>
        </div>`).join('');

      return `
        <!-- Kategori header — 4 cols matching product rows -->
        <div style="display:grid;grid-template-columns:1fr 60px 70px 80px;gap:4px;padding:7px 10px;background:var(--surface);border-bottom:1px solid var(--border);">
          <span style="font-size:12px;font-weight:700;color:var(--text);">${kat}</span>
          <span style="font-size:11px;font-family:var(--mono);font-weight:700;color:var(--text);text-align:right;">${katQty.toLocaleString('id-ID')}</span>
          <span style="font-size:11px;font-family:var(--mono);font-weight:700;color:var(--text);text-align:right;">${katKg>0?katKg.toFixed(1)+' kg':'—'}</span>
          <span style="font-size:11px;font-family:var(--mono);font-weight:700;color:var(--text-2);text-align:right;">${katTotal>0?rpS(katTotal):'—'}</span>
        </div>
        ${rows}`;
    }).join('');

    // Nota list
    const notaList = d.notas.map(n =>
      `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px;color:var(--text-3);font-family:var(--mono);">
        <span>Nota ${n.nota} · ${fd(n.tanggal)}</span>
        <span style="font-weight:500;color:var(--text-2)">${rpS(n.total)}</span>
      </div>`).join('');

    return `<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:2px solid var(--border);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <div style="font-size:13px;font-weight:700;">${nama}</div>
        <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent);">${rpS(d.total)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <div style="flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;">
          <div style="height:100%;background:var(--accent);width:${pct}%;border-radius:3px;"></div>
        </div>
        <span style="font-size:11px;font-family:var(--mono);color:var(--text-3);min-width:44px;text-align:right;">${d.notas.length} nota</span>
      </div>
      ${katKeys.length ? `
      <div style="background:var(--surface2);border-radius:6px;overflow:hidden;margin-bottom:8px;border:1px solid var(--border);">
        ${colHd}
        ${itemsHTML}
      </div>` : ''}
      <div>${notaList}</div>
    </div>`;
  }).join('');
}

/* ── Parse items ── */
function parseItems(itemStr, parsed, itemsArray) {
  // 1. Prefer itemsArray (dari GAS getAllNotas) — punya qty + harga lengkap
  if(itemsArray && itemsArray.length) {
    return itemsArray.map(it => ({
      nama:   it.produk || it.nama || '',
      qty:    +it.qty   || 0,
      satuan: it.satuan || '',
      harga:  +it.harga || 0,
    }));
  }
  // 2. itemsParsed (dari normalize frontend)
  if(parsed && parsed.length) return parsed;
  // 3. Fallback: parse string
  if(!itemStr) return [];
  const results = [];
  const parts = itemStr.split(/[;,]/);
  parts.forEach(part => {
    part = part.trim();
    const pipeM = part.match(/^(.+?)\s*\|\s*(\d+)\s*\|\s*(\w*)\s*\|\s*(\d+)/);
    if(pipeM){ results.push({nama:pipeM[1].trim(),qty:+pipeM[2],satuan:pipeM[3]||'',harga:+pipeM[4]}); return; }
    const xM = part.match(/^(.+?)\s*[×x]\s*(\d+)\s*(\w*)/);
    if(xM){ results.push({nama:xM[1].trim(),qty:+xM[2],satuan:xM[3]||''}); return; }
    if(part) results.push({nama:part,qty:1,satuan:''});
  });
  return results;
}

function rp(n){return n!=null?'Rp '+(+n||0).toLocaleString('id-ID'):'—';}
function rpS(n){if(!n)return'Rp 0';if(n>=1e9)return`Rp ${(n/1e9).toFixed(1)}M`;if(n>=1e6)return`Rp ${(n/1e6).toFixed(1)}jt`;if(n>=1e3)return`Rp ${Math.round(n/1e3)}rb`;return'Rp '+n;}
function fd(d){return d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'2-digit'}):'—';}
